services:
  postgres:
    image: postgres:16-alpine
    container_name: boxofficemojo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boxofficemojo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - boxofficemojo_pg:/var/lib/postgresql/data
volumes:
  boxofficemojo_pg:
